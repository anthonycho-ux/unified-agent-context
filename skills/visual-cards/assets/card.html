<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif; background:#14171c; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { width:{{WIDTH}}px; background:#1d2129; border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:40px 46px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .tag { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#7fb8ff; margin-bottom:14px; }
  .tag.amber { color:#d8b06a; }
  h1 { font-size:23px; color:#f2f2f4; font-weight:650; margin-bottom:10px; }
  .sub { font-size:13px; color:#9a9da5; margin-bottom:26px; line-height:1.5; }
  em { color:#fff; font-style:normal; font-weight:600; }
  /* horizontal pipeline */
  .pipe { display:flex; align-items:stretch; }
  .stage { flex:1; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09); border-radius:12px; padding:15px 12px; text-align:center; }
  .stage .t { font-size:12.5px; color:#e9e9ec; font-weight:600; }
  .stage .d { font-size:10.5px; color:#8a8d94; margin-top:5px; line-height:1.45; }
  .arr { width:30px; display:flex; align-items:center; justify-content:center; color:#5c6270; font-size:16px; }
  /* vertical steps */
  .step { display:flex; gap:16px; }
  .rail { display:flex; flex-direction:column; align-items:center; width:14px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#3b6df0; flex-shrink:0; margin-top:5px; }
  .line { width:2px; flex:1; background:rgba(255,255,255,.10); min-height:12px; }
  .step:last-of-type .line { display:none; }
  .sbody { padding-bottom:16px; }
  .q { font-size:14.5px; color:#e9e9ec; font-weight:600; }
  .a { font-size:12.5px; color:#9a9da5; margin-top:2px; line-height:1.5; }
  /* key-value rows */
  .row { display:flex; gap:14px; padding:12px 0; border-top:1px solid rgba(255,255,255,.07); }
  .row .k { width:160px; font-size:12px; color:#8a8d94; padding-top:2px; }
  .row .v { flex:1; font-size:14px; color:#d6d8dd; line-height:1.5; }
  /* highlight box */
  .hi { margin-top:24px; padding:16px 18px; background:rgba(216,176,106,.08); border-left:3px solid #d8b06a; border-radius:0 10px 10px 0; }
  .hi .k { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#d8b06a; margin-bottom:6px; }
  .hi .v { font-size:14px; color:#e9e9ec; line-height:1.55; }
  .hi.blue { background:rgba(90,150,255,.07); border-left-color:#3b6df0; }
  .hi.blue .k { color:#7fb8ff; }
  /* bars for comparisons */
  .bar { display:flex; align-items:center; gap:12px; margin:10px 0; }
  .bar .bl { width:170px; font-size:12.5px; color:#c9ccd3; text-align:right; }
  .bar .bt { height:20px; border-radius:5px; background:#3b6df0; }
  .bar .bv { font-size:12px; color:#8a8d94; }
  .bar.amber .bt { background:#d8b06a; }
  .bar.dim .bt { background:#454b57; }
</style></head><body>
  <div class="card">{{BODY}}</div>
</body></html>
