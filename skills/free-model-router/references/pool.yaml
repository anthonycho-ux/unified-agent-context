# Free model pool — last live probe 2026-08-17 (Linux, letta lc-local-backend)
# Statuses: ok | unknown | dead. Always probe before committing (statuses rot fast).
# Secrets: NEVER paste keys here. Reference env var / secret-store names only.
# Keep this pool growing: see references/discovery.md for how to find new
# free providers via free search engines / bots, and add `discovered_via` +
# `last_searched` to every entry so stale ones are visible.

channels:  # free discovery channels worth checking when expanding the pool
  - id: web-search
    how: built-in web_search tool
    cost: free
  - id: grok-free
    how: ask Grok free tier (X / grok.com) to list current free LLM API offers
    cost: free, rate-limited
  - id: aside-browser
    how: local `aside` wrapper -> MacBook AI browser for JS-heavy/WAF-blocked
        search pages (Google, Bing, Brave)
    cost: free
  - id: hn-reddit-x
    how: watch HN Show HN / provider accounts on X / r-LocalLLaMA roundups
    cost: free

